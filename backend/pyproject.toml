[project]
name = "interior-ai-platform"
version = "0.1.0"
description = "Open-source AI voice platform for interior design lead automation."
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

